[pytest]
asyncio_mode = auto
# Opt-in tests (live services + LLM cost) are deselected by default so the unit suite is deterministic and
# free; run them explicitly with `pytest -m integration` (a CLI -m overrides this default).
addopts = -m "not integration"
markers =
    integration: opt-in tests that hit live services and cost money (run with -m integration)
